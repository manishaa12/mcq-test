<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>online mcq app</title>
<style>
       /* General body and background styling */
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #3498db, #9b59b6), url('https://source.unsplash.com/1600x900/?teacher,education') no-repeat center center fixed;
        background-size: cover;
        color: white;
    }
/* Login container styling */
    .login-container {
        background: rgba(0, 0, 0, 0.7);
        border-radius: 15px;
        padding: 40px;
        width: 400px;
        text-align: center;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }

    /* Heading text styling */
    h1 {
        font-size: 36px;
        margin-bottom: 30px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

/* Form styling */
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Input field styling */
    input[type="text"],
    input[type="password"] {
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: background-color 0.3s ease;
    }

    /* Input focus effect */
    input[type="text"]:focus,
    input[type="password"]:focus {
        background-color: #f1f1f1;
    }
/* Submit button styling */
    input[type="submit"] {
        padding: 16px;
        border: none;
        border-radius: 8px;
        background-color: #1abc9c;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    /* Submit button hover effect */
    input[type="submit"]:hover {
        background-color: #16a085;
    }


</style>
</head>
<body>
<div class="login-container">
        <h1>Faculty Login</h1>
   <form action=logaction.jsp method=post>
   <input type="text"placeholder="Username" name=u>
   <input type="password"placeholder="Password" name=p>
   <input type="submit" value="Login" id=b>
  
   <tr><td colspan=2 align="center"></style><b>Don't have an account?</b><a href=newreg.html style="color: #4CAF50; text-decoration: none;"><b>New User</b></a></td></tr>
   
   </form>
   
   
   </div>

</body>
</html>
