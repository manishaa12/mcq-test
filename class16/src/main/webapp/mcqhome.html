<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, rgba(106, 17, 203, 0.8), rgba(37, 117, 252, 0.8)), url('https://source.unsplash.com/1600x900/?education,books');
        background-size: cover;
        background-blend-mode: overlay;
        color:#d9534f ;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        text-align: center;
        background: rgba(0, 0, 0, 0.7);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
h1 {
        font-size: 48px;
        margin-bottom: 30px;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }
    .login-container {
        display: flex;
        gap: 30px;
        justify-content: center;
    }
    .login-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 15px;
        width: 220px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s, background-color 0.3s;
    }
    .login-box:hover {
        transform: scale(1.05);
        background: rgba(255, 255, 255, 0.2);
    }
 .login-box h2 {
        margin-bottom: 20px;
        font-size: 24px;
    }
    .login-box form input[type="submit"] {
        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #444;
        color: #ffffff;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .login-box form input[type="submit"]:hover {
        background-color: #d9534f;
    }
     
  </style>

</head>
<body>
<div class="container">
        <h1>ONLINE MCQ PRACTICE APP</h1>
        <div class="login-container">
         <div class="login-box">
                <h2>Student Login</h2>
         <form action="stlogin.html">
          <input type="submit" value="Login as Student">
                </form>
            </div>
            <div class="login-box">
                <h2>Faculty Login</h2>
                <form action="flogin.html">
                    <input type="submit" value="Login as Faculty">
                </form>
            </div>
        </div>
      
      
      </div>
      </div>

</body>
</html>
