<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>online mcq app</title>
<style>
       body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #00c6ff, #0072ff), url('https://source.unsplash.com/1600x900/?student,study');
        background-size: cover;
        background-blend-mode: overlay;
        color: #ffffff;
    }
    .login-container {
        background: rgba(0, 0, 0, 0.7);
        border-radius: 15px;
        padding: 40px;
        width: 400px;
        text-align: center;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
 h1 {
        font-size: 36px;
        margin-bottom: 30px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
    }
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    input[type="text"],
    input[type="password"] {
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }
    input[type="submit"] {
        padding: 12px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: #ffffff;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    input[type="submit"]:hover {
        background-color: #0056b3;
    }

</style>
</head>
<body>
<div class="login-container">
        <h1>Student Login</h1>
   
   <form action=logaction.jsp method=post>
   
   
   <input type="text"placeholder="Username" name=u>
   <input type="password"placeholder="Password" name=p>
   <input type="submit" value="Login" id=b>
   <tr><td colspan=2 align="center"><b>Don't have an account?</b><a href=newreg.html style="color: #4CAF50; text-decoration: none;"><b>New User</b></a></td></tr>
   
   
   
   </form>
   </div>

</body>
</html>
